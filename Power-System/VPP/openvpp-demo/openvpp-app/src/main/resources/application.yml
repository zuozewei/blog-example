server:
  port: 8080

spring:
  application:
    name: openvpp-demo
  datasource:
    # 教学默认：H2 文件库（读者零外部依赖，重启数据仍在）
    url: jdbc:h2:file:${user.home}/.openvpp/openvpp-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true   # 教学演示用，生产关闭

# 专栏示例工程统一约定：接口路径前缀，禁止出现真实项目路径风格
openvpp:
  api-prefix: /api/v1
  gateway:
    # 接入模式：local（默认，本地模拟，零外部依赖，断网可跑）/ remote（真实协议接入）
    # remote 模式下 MQTT 必须显式配置 broker 地址，工程不提供任何默认外部地址
    mode: local
